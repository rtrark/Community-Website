services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    restart: unless-stopped
    volumes:
      - .:/var/www
      - composer-cache:/tmp/composer-cache
    environment:
      COMPOSER_CACHE_DIR: /tmp/composer-cache
    depends_on:
      - redis

  web:
    image: nginx:1.25-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - .:/var/www:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "no", "--save", ""]
    volumes:
      - redis-data:/data

  node:
    image: node:14.19.0-buster
    working_dir: /var/www
    volumes:
      - .:/var/www
      - npm-cache:/root/.npm
    command: sh -lc "mkdir -p public/js public/css public/build && npm ci && npm run production"

volumes:
  composer-cache:
  npm-cache:
  redis-data:
